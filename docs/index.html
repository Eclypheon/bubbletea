<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>bubbletea</title>

    <!-- Mobile Viewport & PWA Meta Tags -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover">
    
    <!-- iOS Add to Home Screen (Standalone Mode) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bubble Tea Shop">
    <link rel="apple-touch-icon" href="TemplateData/favicon.ico">

    <!-- Android & Modern PWA Manifest -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#12141c">
    <link rel="manifest" href="manifest.json">

    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <style>
      html, body {
        width: 100%;
        height: 100%;
        padding: 0;
        margin: 0;
        overflow: hidden;
        background: #12141c;
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
      }

      #unity-container {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
      }

      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
        background: #12141c;
      }

      /* Portrait Orientation Notice */
      #rotate-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(18, 20, 28, 0.97);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        z-index: 999999;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }

      @media screen and (orientation: portrait) {
        #rotate-overlay {
          display: flex !important;
        }
      }

      .phone-icon-anim {
        font-size: 54px;
        animation: rotatePhone 2s ease-in-out infinite alternate;
        margin-bottom: 16px;
      }

      @keyframes rotatePhone {
        0% { transform: rotate(0deg) scale(1); }
        50% { transform: rotate(-90deg) scale(1.1); }
        100% { transform: rotate(-90deg) scale(1.1); }
      }

      .rotate-title {
        font-size: 22px;
        font-weight: bold;
        color: #FFAA00;
        margin-bottom: 8px;
        letter-spacing: 0.5px;
      }

      .rotate-desc {
        font-size: 15px;
        color: #BDC3C7;
        max-width: 320px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <!-- Rotate Device Overlay for Mobile Portrait Mode -->
    <div id="rotate-overlay">
      <div class="phone-icon-anim">📱</div>
      <div class="rotate-title">Please Rotate Your Device</div>
      <div class="rotate-desc">Bubble Tea Shop is best played in <b>Landscape Mode</b>. Turn your phone sideways to play! 🧋</div>
    </div>

    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=1920 height=1080 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer" style="display:none;">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">bubbletea</div>
      </div>
    </div>

    <script>
      // 1. Register PWA Service Worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(function(err) {
          console.log('[PWA] ServiceWorker registration:', err);
        });
      }

      // 2. iOS Silent Mode Switch Bypass & Web Audio Unlocker
      // On iOS, WebAudio defaults to "Ambient" (muted by hardware silent switch).
      // Playing a background HTML5 <audio> stream promotes iOS Safari to the "Playback" category (like YouTube),
      // allowing game audio to bypass the silent switch and play through the speakers!
      var silentHtmlAudio = null;
      function unlockAudioAndBypassSilentSwitch() {
        if (typeof WEBAudio !== 'undefined' && WEBAudio.audioContext) {
          if (WEBAudio.audioContext.state === 'suspended') {
            WEBAudio.audioContext.resume();
          }
        }
        var AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          var temp = new AudioCtx();
          temp.resume().then(function() {
            temp.close();
          });
        }

        if (!silentHtmlAudio) {
          try {
            silentHtmlAudio = document.createElement('audio');
            silentHtmlAudio.setAttribute('x-webkit-airplay', 'deny');
            silentHtmlAudio.preload = 'auto';
            silentHtmlAudio.loop = true;
            // 0.1s silent MP3 data URI
            silentHtmlAudio.src = 'data:audio/mp3;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA=';
            var p = silentHtmlAudio.play();
            if (p !== undefined) {
              p.catch(function() {});
            }
          } catch(e) {}
        }
      function unlockAudio() {
        unlockAudioAndBypassSilentSwitch();
      }

      window.addEventListener('touchstart', unlockAudioAndBypassSilentSwitch, { passive: true });
      window.addEventListener('touchend', unlockAudioAndBypassSilentSwitch, { passive: true });
      window.addEventListener('pointerdown', unlockAudioAndBypassSilentSwitch, { passive: true });
      window.addEventListener('click', unlockAudioAndBypassSilentSwitch, { passive: true });

      // 3. Screen Orientation Lock Attempt
      function attemptLandscapeLock() {
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(function(e) {
            // Screen orientation lock is restricted in some mobile browsers unless fullscreen
          });
        }
      }
      window.addEventListener('load', attemptLandscapeLock);
      document.addEventListener('fullscreenchange', attemptLandscapeLock);

      // 4. Unity Loader Initialization
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/buildv1.5m4.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/buildv1.5m4.data",
        frameworkUrl: buildUrl + "/buildv1.5m4.framework.js",
        codeUrl: buildUrl + "/buildv1.5m4.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "bubbletea",
        productVersion: "1.3.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          unlockAudio();
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
